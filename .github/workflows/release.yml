name: Release Plugin

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v1.1.0, etc.
  workflow_dispatch:  # Allows manual trigger
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Elevate wrapper permissions
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Plugin
        run: ./gradlew clean build

      - name: Get Plugin Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Extract version from tag (remove 'v' prefix if present)
            VERSION="${GITHUB_REF#refs/tags/v}"
            VERSION="${VERSION#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Find JAR file
        id: find_jar
        run: |
          JAR_FILE=$(find build/libs -name "AutoSleepPlugin-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Error: JAR file not found!"
            exit 1
          fi
          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Found JAR: $JAR_FILE"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: AutoSleepPlugin v${{ steps.version.outputs.version }}
          body: |
            ## AutoSleepPlugin v${{ steps.version.outputs.version }}

            A ZenithProxy plugin that automatically finds the saved bed and sleeps at night to skip the server night cycle.

            ### Installation
            1. Download the `AutoSleepPlugin-${{ steps.version.outputs.version }}.jar` file
            2. Place it in the `plugins` folder inside the same folder as the ZenithProxy launcher
            3. Restart ZenithProxy to load the plugin

            ### Features
            - Auto Night Detection with accurate tick-based timing
            - Thunderstorm Sleep support
            - Pathfinding to Bed using Baritone
            - Smart Bed Interaction with retry logic
            - Return to Previous Position after sleeping
            - Leave Bed Blocking to prevent premature wake-up

            ### Commands
            - `autoSleep on/off` - Enable or disable the module
            - `autoSleep bed` - Save current position as bed location
            - `autoSleep bed <x> <y> <z>` - Set bed position manually
            - `autoSleep nightStart <tick>` - Set when night starts (default: 12542)
            - `autoSleep nightEnd <tick>` - Set when night ends (default: 23460)
            - `autoSleep status` - Show current auto-sleep state
          files: ${{ steps.find_jar.outputs.jar_file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

